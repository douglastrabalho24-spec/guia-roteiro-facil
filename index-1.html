<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guia Roteiro Fácil</title><meta name="theme-color" content="#0B5D55">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--tx:#10231F;--mu:#5B6F6A;--pr:#0B5D55;--pt:#fff;--ac:#F2A900;--bd:#D5E0DC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1917;--card:#16282500;--card:#152623;--tx:#E6F0ED;--mu:#8FA8A2;--pr:#3FB8A8;--pt:#06201C;--bd:#274039}}
:root[data-theme="dark"]{--bg:#0D1917;--card:#152623;--tx:#E6F0ED;--mu:#8FA8A2;--pr:#3FB8A8;--pt:#06201C;--bd:#274039}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 96px}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px;font-weight:800}h2{font-size:20px;margin:18px 0 8px}
.mu{color:var(--mu);font-size:14px}
input{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:17px}
input:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;font-weight:600;min-height:48px}
.pri{background:var(--pr);color:var(--pt);width:100%;font-size:17px}
.sec{background:var(--card);color:var(--tx);border:2px solid var(--bd);width:100%}
.chip{display:inline-block;background:var(--card);border:2px solid var(--bd);border-radius:99px;padding:8px 14px;margin:0 6px 8px 0;min-height:40px;font-size:14px;color:var(--tx)}
.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;display:flex;gap:12px;text-align:left;width:100%;color:var(--tx)}
.card.on{border-color:var(--pr);box-shadow:inset 0 0 0 2px var(--pr)}
.ic{font-size:34px;flex:none;width:56px;height:56px;display:grid;place-items:center;background:var(--bg);border-radius:14px}
.nt{font-weight:800;color:var(--tx)}.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:13px;padding:10px 4px}nav button.on{color:var(--pr)}
.bar{position:sticky;bottom:72px;margin-top:12px}
.stop{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-left:3px solid var(--pr);margin-left:14px;padding-left:16px;position:relative}
.stop:before{content:"";position:absolute;left:-9px;top:14px;width:15px;height:15px;border-radius:50%;background:var(--ac);border:3px solid var(--bg)}
.ad{background:var(--bg);border:2px dashed var(--bd);border-radius:12px;text-align:center;padding:12px;color:var(--mu);font-size:13px;margin:12px 0}
.sg{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-top:0;border-radius:0;min-height:48px;font-weight:400}.sg:last-child{border-radius:0 0 14px 14px}.sum{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:6px 0 4px;border-bottom:2px solid var(--bd)}.sum h1{font-size:24px;margin:0}.pri small,.sec small{display:block;font-weight:400;opacity:.85;font-size:12px}.ach{opacity:.5}.ach.ok{opacity:1}.pb{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--ac)}
.tag{background:var(--ac);color:#10231F;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.modal{position:fixed;inset:0;background:#000A;display:grid;place-items:center;padding:20px;z-index:9}.modal>div{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
<button data-v="home">🏠<br>Início</button><button data-v="route">🗺️<br>Roteiro</button><button data-v="ach">🏅<br>Conquistas</button><button data-v="plans">⭐<br>Planos</button>
</div></nav>
<div id="modal"></div>
<script>
const CAT={Histórico:'🏛️',Museu:'🖼️',Praça:'🌳',Parque:'🌿',Praia:'🏖️',Igreja:'⛪',Gastronomia:'🍽️'};
// Amostra de demonstração. Na versão publicada nas lojas, esta lista vem da API Google Places.
const D={
'Rio de Janeiro':[['Cristo Redentor','Histórico',4.8,'Símbolo do Brasil no alto do Corcovado.',-22.9519,-43.2105],['Pão de Açúcar','Parque',4.8,'Bondinho com vista da baía de Guanabara.',-22.9486,-43.1566],['Praia de Copacabana','Praia',4.6,'Calçadão famoso e orla de 4 km.',-22.9711,-43.1822],['Escadaria Selarón','Histórico',4.7,'Degraus cobertos de azulejos coloridos.',-22.9153,-43.1789],['Confeitaria Colombo','Gastronomia',4.5,'Café belle époque de 1894 no Centro.',-22.9035,-43.1783]],
'Salvador':[['Pelourinho','Histórico',4.7,'Centro histórico com casarões coloridos.',-12.9714,-38.5108],['Elevador Lacerda','Histórico',4.7,'Liga a Cidade Baixa à Cidade Alta.',-12.9722,-38.5131],['Igreja do Bonfim','Igreja',4.7,'Famosa pelas fitinhas de pedidos.',-12.9285,-38.5058],['Farol da Barra','Praia',4.7,'Pôr do sol mais famoso da cidade.',-13.0105,-38.5329],['Mercado Modelo','Gastronomia',4.4,'Artesanato e comida baiana.',-12.9736,-38.5133]],
'Ouro Preto':[['Praça Tiradentes','Praça',4.8,'Coração da cidade e do circuito histórico.',-20.3856,-43.5035],['Igreja São Francisco de Assis','Igreja',4.8,'Obra-prima de Aleijadinho.',-20.3868,-43.5019],['Museu da Inconfidência','Museu',4.7,'Conta a história da conjuração mineira.',-20.3857,-43.5036],['Mina do Chico Rei','Histórico',4.6,'Visita a uma antiga mina de ouro.',-20.3917,-43.5087],['Parque Itacolomi','Parque',4.6,'Trilhas e cachoeiras na serra.',-20.4262,-43.4829]],
'Curitiba':[['Jardim Botânico','Parque',4.8,'Estufa de vidro e jardins franceses.',-25.4425,-49.2398],['Ópera de Arame','Parque',4.7,'Teatro de estrutura tubular entre árvores.',-25.3845,-49.2735],['Museu Oscar Niemeyer','Museu',4.6,'O famoso Museu do Olho.',-25.4097,-49.2670],['Rua XV de Novembro','Praça',4.5,'Calçadão histórico e comércio.',-25.4297,-49.2711],['Mercado Municipal','Gastronomia',4.6,'Comidas típicas e produtos locais.',-25.4488,-49.2619]]};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
let S={city:'',sel:[],mode:'walk',hist:[],cities:[],total:0,wk:'',wn:0,plan:'free',cat:'Todos',route:null,v:'home',sort:'near',ref:null,saved:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('gre')||'{}'))}catch(e){}
S.sel=S.sel||[];S.v='home';S.gen=S.gen||{};Object.assign(D,S.gen);
const save=()=>{try{localStorage.setItem('gre',JSON.stringify({...S,v:'home',route:null,ref:null}))}catch(e){}};
const $=s=>document.querySelector(s),app=$('#app');
const wkey=()=>{const d=new Date();const j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-'+Math.floor((d-j)/6048e5)};
const hav=(a,b)=>{const r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,h=Math.sin(x/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h))*1.3};
const SP={walk:5,car:30,bike:15},ML={walk:'🚶 A pé',car:'🚗 Carro',bike:'🚲 Bicicleta'},GM={walk:'walking',car:'driving',bike:'bicycling'};
const fmt=m=>m<60?Math.max(1,Math.round(m))+' min':Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0')+' min';
const places=()=>(D[S.city]||[]);
function go(v){S.v=v;render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function search(q){q=q.trim();if(!q)return;const k=Object.keys(D).find(c=>norm(c)===norm(q)||norm(c).includes(norm(q)));
 if(!k){S.q=q;gen(q);return}
 S.city=k;S.sel=[];S.cat='Todos';S.hist=[k,...S.hist.filter(h=>h!==k)].slice(0,5);save();go('results')}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(S.v==='results'||S.v==='miss'?'home':S.v)));
 if(S.v!==S.lv)window.scrollTo(0,0);S.lv=S.v;big();V[S.v]();}
const ad=()=>!paid()?'<div class="ad">Anúncio · espaço para banner (versão gratuita)</div>':'';
const V={
home(){app.innerHTML=`<h1>Guia Roteiro Fácil</h1><p class="mu">Escolha os lugares, a gente monta o roteiro e abre no Maps ou no Waze.</p>
<form onsubmit="event.preventDefault();search($('#q').value)"><input id="q" oninput="sug()" placeholder="Qual cidade ou lugar você quer visitar?" autocomplete="off" enterkeyhint="search"></form><div id="sug"></div>
<div style="height:10px"></div><button class="pri" onclick="search($('#q').value)">Buscar pontos turísticos</button>
<div style="height:8px"></div><button class="sec" onclick="loc()">📍 Usar minha localização atual</button>
${S.hist.length?'<h2>Pesquisados recentemente</h2>'+S.hist.map(h=>`<button class="chip" onclick="search('${h}')">🕘 ${h}</button>`).join(''):''}
${savedList()}<button class="sec" style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;text-align:left" aria-expanded="${!!S.open}" onclick="S.open=!S.open;render()"><b style="font-size:18px">🏙️ Cidades mais procuradas do Brasil</b><span>${S.open?'▲':'▼'}</span></button>${S.open?`<p class="mu">Toque numa cidade ou digite qualquer outra na busca. Os pontos são montados na hora e guardados no aparelho.</p>${regs()}`:''}
${ad()}`},
load(){app.innerHTML=`<h1>Buscando…</h1><p>Montando os pontos mais famosos de <b>${S.q}</b>. Pode levar alguns segundos.</p>`},
miss(){const q=encodeURIComponent('pontos turísticos em '+S.q);app.innerHTML=`<h1>${S.q}</h1><p>Não consegui montar a lista de pontos desse lugar agora. Confira o nome ou veja os pontos direto no Google Maps.</p>
<a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener"><button class="pri">Ver pontos turísticos no Google Maps</button></a><div style="height:8px"></div><button class="sec" onclick="go('home')">Buscar outra cidade</button>`},
results(){const p=places(),cats=['Todos',...new Set(p.map(x=>x[1]))];
 app.innerHTML=`<button class="chip" onclick="go('home')">← Voltar</button><h1>${S.city}</h1><h2 style="margin-top:4px">⚡ Roteiros prontos</h2><div><button class="chip" onclick="preset('half')">Meio dia (3 pontos)</button><button class="chip" onclick="preset('full')">Dia inteiro</button><button class="chip" onclick="preset('food')">Só gastronomia</button><button class="chip" onclick="preset('hist')">Cultura e história</button></div><p class="mu">Ou toque nos lugares que quer visitar.</p>${S.gen[S.city]?'<p class="mu">Lugares e fotos da Wikipédia (imagens: Wikimedia Commons), em ordem de relevância. Confira horários e se o local está aberto no Maps.</p>':''}<div class="row" style="margin-bottom:8px"><button class="sec" onclick="selAll()">Selecionar todos</button><button class="sec" onclick="S.sel=[];save();render()">Desmarcar todos</button></div><div><button class="chip ${S.sort!=='rate'?'on':''}" onclick="setSort('near')">📍 Mais próximos primeiro</button><button class="chip ${S.sort==='rate'?'on':''}" onclick="setSort('rate')">⭐ Mais bem avaliados primeiro</button></div>${S.sort==='rate'?'':`<p class="mu" style="margin:0 0 8px">Distância aproximada ${S.ref?'da sua localização':'do centro da cidade'}.</p>`}
 <div>${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${c==='Todos'?'Todos':CAT[c]+' '+c}</button>`).join('')}</div>
 ${vis().map(({x,i})=>`<button class="card ${S.sel.includes(i)?'on':''}" onclick="tog(${i})"><div class="ic">${x[6]?`<img src="${x[6]}" alt="" loading="lazy" style="width:56px;height:56px;object-fit:cover;border-radius:14px" onerror="this.style.display='none'">`:CAT[x[1]]}</div><div><div class="nt">${S.sel.includes(i)?'✅ ':''}${x[0]}</div><div class="mu">${x[1]}${x[2]?' · ⭐ '+x[2]:''}${S.sort==='rate'?'':' · '+dkm(x)}</div><div>${x[3]}</div></div></button>`).join('')}
 <div class="bar"><button class="pri" ${S.sel.length?'':'disabled style="opacity:.5"'} onclick="build()">Montar roteiro (${S.sel.length})</button></div>`},
route(){const r=S.route;if(!r){app.innerHTML=`<h1>Roteiro</h1><p>Você ainda não montou um roteiro. Escolha uma cidade e selecione os pontos que quer visitar.</p><button class="pri" onclick="go('home')">Escolher cidade</button>`;return}
 const dist=r.legs.reduce((a,b)=>a+b,0),tm=dist/SP[S.mode]*60;
 const o=r.order[0],Q=x=>encodeURIComponent(x[0]+', '+S.city.replace(/\s*\(([^)]+)\)/,', $1')),L=r.order[r.order.length-1],W=r.order.slice(0,-1);
 const gm='https://www.google.com/maps/dir/?api=1&travelmode='+GM[S.mode]+'&destination='+Q(L)+(W.length?'&waypoints='+W.map(Q).join('%7C'):'');
 const wz='https://waze.com/ul?q='+Q(o)+'&navigate=yes';
 app.innerHTML=`<div class="sum"><h1>Roteiro em ${S.city}</h1><p class="mu" style="margin:2px 0 0">${r.order.length} pontos • ${kt(dist)} de deslocamento</p><p class="mu" style="margin:0">Tempo total com visitas: ${fmt(dist/SP[S.mode]*60+r.order.length*45)} (45 min por ponto)</p></div>
 <div>${Object.keys(ML).map(m=>`<button class="chip ${S.mode===m?'on':''}" onclick="S.mode='${m}';render()">${ML[m]}</button>`).join('')}</div>
 <div style="margin-top:10px">${r.order.map((x,i)=>`<div class="stop">${x[6]?`<img src="${x[6]}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:12px;flex:none" onerror="this.style.display='none'">`:''}<div><div class="nt">${x[0]} ${(S.visited||[]).includes(x[0])?'✅':''}</div><div class="mu">${CAT[x[1]]} ${x[1]}${i?` · ${kt(r.legs[i-1])}`:' · ponto de partida'}</div><button class="chip" style="margin:4px 0 0;min-height:36px" onclick="checkin(${D[S.city].indexOf(x)})">📍 Cheguei aqui</button><a class="chip" style="margin:4px 0 0 6px;min-height:36px" href="https://www.google.com/search?tbm=isch&q=${Q(x)}" target="_blank" rel="noopener">📷 Ver fotos</a></div></div>`).join('')}</div>
 <h2>Abrir navegação</h2>
 <a href="${gm}" target="_blank" rel="noopener"><button class="pri">🔵 Abrir rota completa<small>no Google Maps, com todos os pontos</small></button></a><div style="height:8px"></div>
 <a href="${wz}" target="_blank" rel="noopener"><button class="sec">🔴 Abrir até o primeiro ponto<small>no Waze</small></button></a>
 <p class="mu">Waze não suporta vários pontos de uma vez. Ao chegar, volte aqui para seguir ao próximo ponto.</p><button class="sec" id="svb" onclick="saveRoute()">${isSaved()?'✅ Roteiro salvo':'💾 Salvar este roteiro'}</button><div style="height:8px"></div><a href="https://wa.me/?text=${encodeURIComponent('Meu roteiro em '+S.city+': '+r.order.map(x=>x[0]).join(' → ')+'\n'+gm)}" target="_blank" rel="noopener"><button class="sec">💬 Compartilhar no WhatsApp</button></a>${paid()?'':`<p class="mu">Gostou? Roteiros ilimitados e sem anúncios. <button class="chip" onclick="go('plans')">Testar 7 dias grátis</button></p>`}`},
ach(){const A=[['🏅','Explorador Iniciante','Monte 1 roteiro','Desbloqueia dicas extras',S.total,1],['🥈','Viajante','Roteiros em 5 cidades diferentes','Desbloqueia o modo sem anúncios',S.cities.length,5],['🥉','Mestre Viajante','Monte 20 roteiros','Desbloqueia o pacote de funções avançadas',S.total,20]];
 app.innerHTML=`<h1>Conquistas</h1><p class="mu">${S.total} roteiros · ${S.cities.length} cidades · ${(S.visited||[]).length} check-ins</p><h2>Passaporte</h2><div>${S.cities.length?S.cities.map(c=>`<span class="chip on">🎫 ${c}</span>`).join(''):'<p class="mu">Monte um roteiro para ganhar o primeiro carimbo.</p>'}${(S.visited||[]).map(v=>`<span class="chip">✅ ${v}</span>`).join('')}</div>`+A.map(a=>`<div class="card ${a[4]>=a[5]?'on':''}"><div class="ic">${a[0]}</div><div style="flex:1"><div class="nt">${a[1]} ${a[4]>=a[5]?'<span class="tag">Conquistado</span>':''}</div><div>${a[2]}</div><div class="mu">${a[3]}</div><div class="pb"><i style="width:${Math.min(100,a[4]/a[5]*100)}%"></i></div><div class="mu">${Math.min(a[4],a[5])} de ${a[5]}</div></div></div>`).join('')},
plans(){const P=[['free','Gratuito','R$ 0','3 roteiros por semana, com anúncios'],['basic','Básico','R$ 9,90/mês ou R$ 59,90/ano (economize 50%)','Roteiros ilimitados, sem anúncios'],['full','Completo','R$ 14,90/mês ou R$ 89,90/ano (economize 50%)','Sugestões inteligentes, favoritos e compartilhar roteiros']];
 app.innerHTML=`<h1>Planos</h1><p class="mu">Prévia: o botão simula a assinatura. No app final, o pagamento passa pelo Google Play e App Store.</p>${trialBox()}`+P.map(p=>`<div class="card ${S.plan===p[0]?'on':''}" style="display:block"><div class="nt">${p[1]} ${S.plan===p[0]?'<span class="tag">Seu plano</span>':''}</div><div class="mu">${p[2]}</div><div>${p[3]}</div>${S.plan===p[0]?'':`<div style="height:8px"></div><button class="pri" onclick="S.plan='${p[0]}';save();render()">Testar este plano</button>`}</div>`).join('')+settings()}};
const REG={'Nordeste':[['Salvador','BA'],['Aracaju','SE'],['Maceió','AL'],['Recife','PE'],['Natal','RN'],['Fortaleza','CE'],['João Pessoa','PB'],['São Luís','MA']],'Sudeste':[['Rio de Janeiro','RJ'],['São Paulo','SP'],['Vitória','ES'],['Belo Horizonte','MG']],'Sul':[['Curitiba','PR'],['Porto Alegre','RS'],['Florianópolis','SC']],'Centro-Oeste':[['Brasília','DF'],['Goiânia','GO'],['Cuiabá','MT']],'Norte':[['Manaus','AM'],['Belém','PA']]};
const POOL=[...Object.values(REG).flat(),['Ouro Preto','MG']];
const regs=()=>Object.entries(REG).map(([r,l])=>`<div class="mu" style="margin:10px 0 6px"><b>🏙️ ${r}</b></div>`+l.map(c=>`<button class="chip" onclick="search('${c[0]}')">${c[0]} (${c[1]})</button>`).join('')).join('');
const kt=km=>km.toFixed(1).replace('.',',')+' km • '+fmt(km/SP[S.mode]*60);
function sug(){const q=norm($('#q').value),el=$('#sug');if(!q){el.innerHTML='';return}const m=POOL.filter(c=>norm(c[0]).includes(q)).sort((a,b)=>norm(b[0]).startsWith(q)-norm(a[0]).startsWith(q)).slice(0,6);el.innerHTML=m.map(c=>`<button class="sg" onclick="search('${c[0]}')">📍 ${c[0]} (${c[1]})</button>`).join('')+`<button class="sg" onclick="search($('#q').value)">🔍 Buscar “${$('#q').value.replace(/[<>&"]/g,'')}”</button>`}
const cen=()=>{const p=places();return[p.reduce((a,x)=>a+x[4],0)/p.length,p.reduce((a,x)=>a+x[5],0)/p.length]};
const dist1=x=>hav(S.ref||cen(),[x[4],x[5]]);
const dkm=x=>dist1(x).toFixed(1).replace('.',',')+' km';
const srt=(a,b)=>S.sort==='rate'?((b.x[2]||0)-(a.x[2]||0))||(a.x[2]?dist1(a.x)-dist1(b.x):a.i-b.i):dist1(a.x)-dist1(b.x);
const vis=()=>places().map((x,i)=>({x,i})).filter(o=>S.cat==='Todos'||o.x[1]===S.cat).sort(srt);
function selAll(){vis().forEach(o=>{if(!S.sel.includes(o.i))S.sel.push(o.i)});save();render()}
function setSort(k){S.sort=k;save();if(k==='near'&&!S.ref&&navigator.geolocation)need(()=>navigator.geolocation.getCurrentPosition(p=>{S.ref=[p.coords.latitude,p.coords.longitude];if(S.v==='results')render()},()=>{}));render()}
const sid=()=>S.city+'|'+S.route.order.map(x=>D[S.city].indexOf(x)).join(',');
const isSaved=()=>!!S.route&&(S.saved||[]).some(s=>s.id===sid());
function saveRoute(){if(!S.route||isSaved())return;S.saved=[{id:sid(),city:S.city,idx:S.route.order.map(x=>D[S.city].indexOf(x)),mode:S.mode},...(S.saved||[])].slice(0,20);save();$('#svb').textContent='✅ Roteiro salvo'}
function openSaved(i){const s=S.saved[i],p=D[s.city],order=s.idx.map(k=>p[k]),legs=[];for(let k=1;k<order.length;k++)legs.push(hav([order[k-1][4],order[k-1][5]],[order[k][4],order[k][5]]));S.city=s.city;S.mode=s.mode;S.route={order,legs};go('route')}
function delSaved(i){S.saved.splice(i,1);save();render()}
const savedList=()=>(S.saved||[]).length?'<h2>Roteiros salvos</h2>'+S.saved.map((s,i)=>`<div class="row" style="margin:6px 0"><button class="sec" style="flex:5;text-align:left" onclick="openSaved(${i})">💾 ${s.city} • ${s.idx.length} pontos • ${ML[s.mode]}</button><button class="sec" style="flex:1" aria-label="Excluir roteiro" onclick="delSaved(${i})">✕</button></div>`).join(''):'';
const paid=()=>S.plan!=='free'||(S.trial&&S.trial>Date.now());
const trialBox=()=>S.plan!=='free'?'':S.trial&&S.trial>Date.now()?`<div class="card on" style="display:block"><b>Teste grátis ativo</b><div class="mu">Restam ${Math.ceil((S.trial-Date.now())/864e5)} dias de roteiros ilimitados e sem anúncios.</div></div>`:S.trial?'':`<div class="card on" style="display:block"><b>7 dias grátis</b><div>Roteiros ilimitados e sem anúncios. Sem cartão nesta prévia.</div><div style="height:8px"></div><button class="pri" onclick="S.trial=Date.now()+6048e5;save();render()">Começar teste grátis</button></div>`;
const msg=t=>{$('#modal').innerHTML=`<div class="modal"><div><p>${t}</p><button class="pri" onclick="$('#modal').innerHTML=''">OK</button></div></div>`};
function need(cb){if(S.consent)return cb();window._cb=cb;$('#modal').innerHTML=`<div class="modal"><div><h2 style="margin-top:0">Usar sua localização?</h2><p>Usamos a localização só neste aparelho, para ordenar pontos por distância e confirmar check-ins. Ela não é enviada nem guardada.</p><button class="pri" onclick="S.consent=1;save();$('#modal').innerHTML='';window._cb()">Permitir</button><div style="height:8px"></div><button class="sec" onclick="$('#modal').innerHTML=''">Agora não</button></div></div>`}
function preset(k){const all=places().map((x,i)=>({x,i}));let l=all.slice().sort((a,b)=>b.x[2]-a.x[2]);if(k==='half')l=l.slice(0,3);if(k==='food')l=all.filter(o=>o.x[1]==='Gastronomia');if(k==='hist')l=all.filter(o=>['Histórico','Igreja','Museu'].includes(o.x[1]));if(!l.length){msg('Nenhum ponto dessa categoria nesta cidade.');return}S.sel=l.map(o=>o.i);build()}
function checkin(i){need(()=>navigator.geolocation.getCurrentPosition(p=>{const x=D[S.city][i],d=hav([p.coords.latitude,p.coords.longitude],[x[4],x[5]])/1.3;if(d<=0.4){S.visited=[...new Set([...(S.visited||[]),x[0]])];save();render();msg('Check-in confirmado em '+x[0]+'! 🎉')}else msg('Você está a '+d.toFixed(1).replace('.',',')+' km de '+x[0]+'. Chegue mais perto para fazer check-in.')},()=>msg('Não foi possível confirmar sua localização. Libere a permissão e tente de novo.')))}
const big=()=>{document.body.style.fontSize=S.big?'19px':'16px'};
const settings=()=>`<h2>Ajustes</h2><button class="sec" onclick="S.big=!S.big;save();render()">🔠 Texto maior: ${S.big?'ligado':'desligado'}</button><div style="height:8px"></div><button class="sec" onclick="priv()">🔒 Privacidade e dados</button><div style="height:8px"></div><button class="sec" onclick="wipe()">🗑️ Apagar meus dados</button>`;
function priv(){msg('Seus roteiros, histórico e conquistas ficam só neste aparelho. A localização só é usada com sua permissão e não é enviada nem guardada. Ao abrir Google Maps ou Waze, vale a política de privacidade desses apps.')}
function wipe(){try{localStorage.removeItem('gre')}catch(e){}msg('Dados apagados.');setTimeout(()=>location.reload(),900)}
const WP='https://pt.wikipedia.org/w/api.php?format=json&origin=*&action=query&';
const KW=[['Igreja',/igreja|catedral|bas[ií]lica|capela|santu[aá]rio|convento|mosteiro/i],['Museu',/museu|memorial|centro cultural|galeria|planet[aá]rio/i],['Gastronomia',/mercado|restaurante|caf[eé]|confeitaria|feira/i],['Praia',/praia|orla/i],['Praça',/pra[cç]a|largo|cal[cç]ad[aã]o/i],['Parque',/parque|jardim|reserva|cachoeira|serra|mirante|pico|morro|lagoa|zool[oó]gico|bosque|gruta/i],['Histórico',/forte|pal[aá]cio|casar[aã]o|teatro|monumento|esta[cç][aã]o|ponte|farol|elevador|fortaleza|castelo|pelourinho|est[aá]tua|centro hist[oó]rico|arco|torre|solar|sobrado|chafariz|cruzeiro|pante[aã]o|obelisco|escadaria/i]];
const wp=async p=>(await fetch(WP+p)).json();
async function gen(q){S.v='load';S.q=q;render();try{
 const s1=await wp('prop=coordinates&generator=search&gsrsearch='+encodeURIComponent(q+' município Brasil')+'&gsrlimit=1&colimit=1');
 const c=Object.values(s1.query.pages)[0];if(!c.coordinates)throw 0;
 const lat=c.coordinates[0].lat,lon=c.coordinates[0].lon,name=c.title;
 const g=await wp('generator=geosearch&ggscoord='+lat+'%7C'+lon+'&ggsradius=10000&ggslimit=50&prop=coordinates%7Cpageimages%7Cinfo%7Cextracts&piprop=thumbnail&pithumbsize=400&pilimit=max&cllimit=max&exintro=1&explaintext=1&exchars=110&exlimit=max');
 const p=Object.values(g.query.pages).filter(x=>x.coordinates&&x.pageid!==c.pageid).map(x=>{const k=KW.find(k=>k[1].test(x.title));return k&&[x.title,k[0],null,(x.extract||'').replace(/\s+/g,' '),x.coordinates[0].lat,x.coordinates[0].lon,x.thumbnail?x.thumbnail.source:'',x.length||0]}).filter(Boolean).sort((a,b)=>b[7]-a[7]).slice(0,8).map(x=>x.slice(0,7));
 if(p.length<2)throw 1;
 D[name]=p;S.gen[name]=p;S.city=name;S.sel=[];S.cat='Todos';S.hist=[name,...S.hist.filter(h=>h!==name)].slice(0,5);save();go('results')
}catch(e){S.v='miss';render()}}
function tog(i){const k=S.sel.indexOf(i);k<0?S.sel.push(i):S.sel.splice(k,1);save();render()}
function build(){
 if(S.wk!==wkey()){S.wk=wkey();S.wn=0}
 if(!paid()&&S.wn>=3){$('#modal').innerHTML=`<div class="modal"><div><h2 style="margin-top:0">Limite da semana</h2><p>Você usou os 3 roteiros gratuitos desta semana. Assine o plano Básico e monte quantos quiser, sem anúncios.</p><button class="pri" onclick="$('#modal').innerHTML='';go('plans')">Ver planos</button><div style="height:8px"></div><button class="sec" onclick="$('#modal').innerHTML=''">Agora não</button></div></div>`;return}
 const pts=S.sel.map(i=>places()[i]);let cur=pts[0],left=pts.slice(1),order=[cur],legs=[];
 while(left.length){let bi=0,bd=1e9;left.forEach((p,i)=>{const d=hav([cur[4],cur[5]],[p[4],p[5]]);if(d<bd){bd=d;bi=i}});cur=left.splice(bi,1)[0];order.push(cur);legs.push(bd)}
 S.route={order,legs};S.wn++;S.total++;if(!S.cities.includes(S.city))S.cities.push(S.city);save();go('route')}
function loc(){if(!S.consent){need(loc);return}if(!navigator.geolocation){alert('Seu navegador não permite localização.');return}
 navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=pt-BR&lat='+p.coords.latitude+'&lon='+p.coords.longitude);const a=(await r.json()).address||{};search(a.city||a.town||a.village||a.municipality)}catch(e){msg('Não foi possível identificar sua cidade. Digite o nome na busca.')}},()=>alert('Não foi possível acessar sua localização. Libere a permissão ou digite a cidade.'))}
render();
</script>
</body>
</html>
